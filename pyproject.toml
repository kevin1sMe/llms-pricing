[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llms-pricing"
version = "0.1.0"
description = "爬取大模型价格信息"
authors = [
    {name = "Author", email = "author@example.com"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "openai-agents>=0.0.1",
    "uvx>=0.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
]

[tool.hatch.build.targets.wheel]
packages = ["."]  # 将当前目录作为包

[tool.hatch.envs.default]
dependencies = [
    "openai>=1.0.0",
    "openai-agents>=0.0.1",
] 